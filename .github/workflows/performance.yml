# Simulation throughput.
#
# One number, measured the same way every time: fixed updates per second, and what multiple
# of real time that is. A drift simulator that cannot run several hundred times faster than
# real time cannot be tuned with headless sweeps, which is the whole point of the headless
# runner.
#
# The threshold is deliberately generous — hosted runners are noisy neighbours — so this
# catches an order-of-magnitude regression, not a five percent one.
name: performance

on:
  pull_request:
    paths:
      - "src/physics.*"
      - "src/tire.*"
      - "src/drivetrain.*"
      - "src/vehicle.*"
      - "src/game.c"
      - "src/dev_state.*"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  throughput:
    name: fixed-update throughput
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch raylib headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raysan5/raylib
          ref: "6.0"
          path: third_party/raylib-src

      - name: Measure the pull request head
        id: head
        run: |
          make tests
          for _ in 1 2 3; do ./drifty_tests --benchmark 480000 | tee -a /tmp/head.txt; done
          best=$(grep -o 'ticks_per_second=[0-9]*' /tmp/head.txt | cut -d= -f2 | sort -n | tail -1)
          echo "ticks=$best" >> "$GITHUB_OUTPUT"
          echo "head: $best ticks/s"

      - name: Measure the merge base
        id: base
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          mkdir -p /tmp/base/third_party
          ln -s "$PWD/third_party/raylib-src" /tmp/base/third_party/raylib-src
          if ! ( cd /tmp/base && make tests && for _ in 1 2 3; do ./drifty_tests --benchmark 480000; done ) > /tmp/base.txt 2>&1; then
            echo "status=unbuildable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          best=$(grep -o 'ticks_per_second=[0-9]*' /tmp/base.txt | cut -d= -f2 | sort -n | tail -1)
          echo "ticks=$best" >> "$GITHUB_OUTPUT"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Compare
        run: |
          head="${{ steps.head.outputs.ticks }}"
          {
            echo "## Simulation throughput"
            echo ""
            echo "| Build | ticks/s | x real time |"
            echo "|---|---:|---:|"
            echo "| head | ${head} | $((head / 120)) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.base.outputs.status }}" != "ok" ]; then
            echo "| base | not buildable | — |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base="${{ steps.base.outputs.ticks }}"
          {
            echo "| base | ${base} | $((base / 120)) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail only on a halving: anything tighter is measuring the runner, not the code.
          if [ "$head" -lt $((base / 2)) ]; then
            echo "Throughput fell from ${base} to ${head} ticks/s." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
