# The same checks the Makefile offers locally, run on every push and pull request.
#
# Both jobs pass CIRCUIT_STRICT=1, which turns a missing tool from a SKIP into a failure.
# Without it a runner that happens to lack cppcheck would report a green tick for a job
# that never linted anything.
#
# The canonical Windows toolchain is the required CI environment and matches the platform
# developers actually build and run.
#
# Actions are pinned by commit SHA, not tag, so a moved tag cannot change what runs here.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ucrt64:
    name: Windows UCRT64 (canonical) (required)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          # The action's cached release already contains a coherent base system. Avoid a
          # full package upgrade on every run; setup currently takes 96 seconds in CI.
          update: false
          cache: true
          install: >-
            make
            git
          # `:p` resolves to the mingw-w64-ucrt-x86_64- prefix for this msystem.
          # pkgconf is not optional: the Makefile errors out without pkg-config,
          # and uses it to locate the raylib headers and cflags.
          pacboy: >-
            gcc:p
            pkgconf:p
            raylib:p
            clang:p
            cppcheck:p
            python:p
            uv:p

      # uv (installed above as `uv:p`, native to this MSYS2 shell) owns the Python tooling.
      # PyPI's ruff ships MSVC wheels only, so it cannot install into MSYS2's mingw python;
      # --python 3.13 makes uv fetch a managed MSVC CPython for the ruff wheel, and
      # UV_TOOL_BIN_DIR drops ruff into the UCRT64 bin dir so `command -v ruff` finds it.
      - name: Install pinned Python tooling
        # ruff==0.15.20 must match requirements-dev.txt and .pre-commit-config.yaml.
        run: UV_TOOL_BIN_DIR="$MINGW_PREFIX/bin" uv tool install --python 3.13 ruff==0.15.20

      - name: Resolved toolchain
        run: make info

      # `verify` includes the pinned ruff check and the complete required project gate.
      - name: Verify (format, Python, lint, analyze, physics, regression)
        # These prerequisites use separate outputs, so Make can safely overlap them.
        run: make -j4 CIRCUIT_STRICT=1 verify
